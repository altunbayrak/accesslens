services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: accesslens
      POSTGRES_USER: accesslens
      POSTGRES_PASSWORD: accesslens
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accesslens"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: [postgres_data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: ./backend
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
  web:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]
  browser-worker:
    build: ./worker
    profiles: ["worker"]
    command: ["https://example.com", "[\"example.com\"]"]
volumes:
  postgres_data:
